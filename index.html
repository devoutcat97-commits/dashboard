<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мой дашборд</title>
  <meta name="description" content="Личный дашборд: деньги, работа, учёба, время">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Для iPhone: значок и полноэкранный режим, когда дашборд добавлен на экран «Домой» -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Дашборд">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Шрифт Golos Text (создан для русского языка) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=32">
  <script>
    // Применяем сохранённые тему и цвет до отрисовки, чтобы не было «вспышки».
    try {
      var t = localStorage.getItem('dash:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var a = localStorage.getItem('dash:accent');
      if (a && a !== 'emerald') document.documentElement.dataset.accent = a;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="masthead">
        <a class="brand" href="#summary">
          <img src="icon.svg" alt="" width="26" height="26">
          <span>Мой дашборд</span>
        </a>
        <div class="masthead-actions">
          <button id="search-btn" class="icon-btn round-btn" type="button" aria-label="Добавить или найти (Ctrl+K)" data-tip="Добавить или найти · Ctrl+K"></button>
          <button id="theme-btn" class="icon-btn round-btn" type="button"></button>
          <button id="settings-btn" class="icon-btn round-btn" type="button" aria-label="Настройки"></button>
        </div>
      </div>

      <nav id="nav" class="nav" aria-label="Разделы"></nav>

      <div class="sidebar-foot">
        <span id="sync-chip" class="sync-chip"><span class="dot"></span><span class="sync-text"></span></span>
      </div>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- ?v=… — номер версии: меняем при обновлении, чтобы браузер не брал старые файлы из кэша -->
  <script src="js/store.js?v=32"></script>
  <script src="js/ui.js?v=32"></script>
  <script src="js/fx.js?v=32"></script>
  <script src="js/charts.js?v=32"></script>
  <script src="js/money-data.js?v=32"></script>
  <script src="js/money.js?v=32"></script>
  <script src="js/work.js?v=32"></script>
  <script src="js/study.js?v=32"></script>
  <script src="js/time.js?v=32"></script>
  <script src="js/weather.js?v=32"></script>
  <script src="js/achievements.js?v=32"></script><script src="js/summary.js?v=32"></script>
  <script src="js/reminders.js?v=32"></script>
  <script src="js/command.js?v=32"></script>
  <script src="js/app.js?v=32"></script>
</body>
</html>
