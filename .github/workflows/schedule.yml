# Каждый день забирает расписание группы с сайта РАНХиГС и обновляет data/schedule.json.
# Запустить вручную: вкладка Actions → «Обновить расписание» → Run workflow.
name: Обновить расписание

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 05:00 по Барнаулу
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Загрузить расписание
        run: python tools/fetch_schedule.py
      - name: Сохранить, если изменилось
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Расписание обновлено"
          git push
